# REFERENCIA: fuente de datos InfluxDB (Flux) con token de solo lectura.
apiVersion: 1
datasources:
  - name: InfluxDB-Seguridad
    uid: influx-seguridad
    type: influxdb
    access: proxy
    url: https://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: ${INFLUX_ORG}
      defaultBucket: ${INFLUX_BUCKET}
      tlsAuthWithCACert: true
    secureJsonData:
      token: ${INFLUX_READ_TOKEN}
      tlsCACert: $__file{/etc/ssl/certs/monitoreo-ca.crt}
