# REFERENCIA: puntos de contacto y política de notificación de Grafana Alerting.
#   alta  -> Telegram + correo, de inmediato
#   media -> solo correo, agrupado cada 30 minutos
#   baja  -> sin regla de alerta: queda en el tablero y en el resumen diario
apiVersion: 1

contactPoints:
  - orgId: 1
    name: telegram-y-correo
    receivers:
      - uid: telegram-alta
        type: telegram
        settings:
          bottoken: ${TELEGRAM_BOT_TOKEN}     # token entregado por BotFather
          chatid: "${TELEGRAM_CHAT_ID}"
          parse_mode: HTML
      - uid: correo-alta
        type: email
        settings:
          addresses: ${CORREO_ALERTAS}
          singleEmail: true
  - orgId: 1
    name: correo-agrupado
    receivers:
      - uid: correo-media
        type: email
        settings:
          addresses: ${CORREO_ALERTAS}
          singleEmail: true

policies:
  - orgId: 1
    receiver: correo-agrupado
    group_by: ["alertname", "severidad"]
    routes:
      - receiver: telegram-y-correo
        object_matchers:
          - ["severidad", "=", "alta"]
        group_wait: 0s
        group_interval: 1m
        repeat_interval: 1h
      - receiver: correo-agrupado
        object_matchers:
          - ["severidad", "=", "media"]
        group_wait: 30s
        group_interval: 30m
        repeat_interval: 4h
