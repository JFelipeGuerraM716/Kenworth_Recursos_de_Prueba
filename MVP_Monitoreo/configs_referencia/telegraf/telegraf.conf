# REFERENCIA: Telegraf como puente Wazuh -> InfluxDB.

[agent]
  interval = "30s"
  flush_interval = "10s"
  omit_hostname = true

# 1) Alertas: lee cada línea nueva de alerts.json y la convierte en métrica.
#    /demo/alerts.json lo alimenta scripts/reproducir_demo.py (modo demostración).
[[inputs.tail]]
  files = ["/var/ossec/logs/alerts/alerts.json", "/demo/alerts.json"]
  from_beginning = false
  watch_method = "poll"
  name_override = "wazuh_alertas"
  data_format = "json_v2"

  [[inputs.tail.json_v2]]
    timestamp_path = "timestamp"
    timestamp_format = "2006-01-02T15:04:05.000-0700"

    [[inputs.tail.json_v2.tag]]
      path = "agent.name"
      rename = "agente"
    [[inputs.tail.json_v2.tag]]
      path = "rule.id"
      rename = "regla"
    [[inputs.tail.json_v2.tag]]
      path = "rule.level"
      rename = "nivel"
    [[inputs.tail.json_v2.tag]]
      path = "data.srcip"
      rename = "srcip"
      optional = true
    [[inputs.tail.json_v2.tag]]
      path = "data.dstip"
      rename = "destino"
      optional = true

    [[inputs.tail.json_v2.field]]
      path = "rule.level"
      rename = "nivel_num"
      type = "int"
    [[inputs.tail.json_v2.field]]
      path = "rule.description"
      rename = "descripcion"
      type = "string"

# 1b) Todos los eventos (no solo alertas) para que la IA aprenda lo «normal».
#     Requiere <logall_json>yes</logall_json> en el ossec.conf del manager.
#     Volumen alto: definir retención corta para esta medición.
[[inputs.tail]]
  files = ["/var/ossec/logs/archives/archives.json"]
  from_beginning = false
  watch_method = "poll"
  name_override = "wazuh_eventos"
  data_format = "json_v2"

  [[inputs.tail.json_v2]]
    timestamp_path = "timestamp"
    timestamp_format = "2006-01-02T15:04:05.000-0700"
    [[inputs.tail.json_v2.tag]]
      path = "data.srcip"
      rename = "srcip"
      optional = true
    [[inputs.tail.json_v2.tag]]
      path = "agent.name"
      rename = "agente"
    [[inputs.tail.json_v2.field]]
      path = "data.dstport"
      rename = "puerto"
      type = "int"
      optional = true
    [[inputs.tail.json_v2.field]]
      path = "data.dstuser"
      rename = "usuario"
      type = "string"
      optional = true
    [[inputs.tail.json_v2.field]]
      path = "data.result"
      rename = "resultado"
      type = "string"
      optional = true
    [[inputs.tail.json_v2.field]]
      path = "data.action"
      rename = "accion"
      type = "string"
      optional = true
    [[inputs.tail.json_v2.field]]
      path = "data.bytes"
      rename = "bytes"
      type = "int"
      optional = true

# 1c) Modo demostración: puntajes de IA del prototipo, ya en line protocol.
[[inputs.tail]]
  files = ["/demo/ia.lp"]
  from_beginning = false
  watch_method = "poll"
  data_format = "influx"

# 2) Estado de los agentes: API de Wazuh por HTTPS con JWT.
#    El token lo mantiene vigente el servicio wazuh-token (renovar_token.sh).
[[inputs.http]]
  urls = ["${WAZUH_API_URL}/agents/summary/status"]
  token_file = "/run/wazuh/token"
  tls_ca = "/etc/ssl/certs/monitoreo-ca.crt"
  name_override = "wazuh_agentes"
  interval = "60s"
  data_format = "json_v2"

  [[inputs.http.json_v2]]
    [[inputs.http.json_v2.field]]
      path = "data.connection.active"
      rename = "activos"
      type = "int"
    [[inputs.http.json_v2.field]]
      path = "data.connection.disconnected"
      rename = "desconectados"
      type = "int"
    [[inputs.http.json_v2.field]]
      path = "data.connection.total"
      rename = "total"
      type = "int"

# Agrega la etiqueta severidad (baja 0-6, media 7-11, alta 12-15).
[[processors.starlark]]
  namepass = ["wazuh_alertas"]
  script = "/etc/telegraf/severidad.star"

# Salida: InfluxDB 2.x por HTTPS con un token de solo escritura.
[[outputs.influxdb_v2]]
  urls = ["https://influxdb:8086"]
  token = "${INFLUX_WRITE_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
  tls_ca = "/etc/ssl/certs/monitoreo-ca.crt"
