<!--
  Cambios en /var/ossec/etc/ossec.conf del Wazuh manager.
  No reemplace el archivo: agregue estas líneas dentro de las secciones que ya existen.
-->
<ossec_config>
  <global>
    <!-- Guarda todos los eventos en archives.json para que la IA aprenda lo normal -->
    <logall_json>yes</logall_json>
  </global>

  <ruleset>
    <!-- Lista de orígenes con cambio autorizado (la usa la regla 100031) -->
    <list>etc/lists/cambios_autorizados</list>
  </ruleset>
</ossec_config>
