<!--
  REFERENCIA: fragmento de /var/ossec/etc/ossec.conf en cada agente (equipo vigilado).
  El agente envía sus eventos cifrados (AES) al manager por 1514/TCP
  y se registra ante él por 1515/TCP.
-->
<ossec_config>
  <client>
    <server>
      <address>10.60.0.30</address>   <!-- LOG-LAB: Wazuh manager -->
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>10.60.0.30</manager_address>
      <port>1515</port>
      <agent_name>DB-LAB</agent_name>
      <groups>servidores</groups>
      <!-- Contraseña de registro: crear /var/ossec/etc/authd.pass con permisos 640 -->
      <authorization_pass_path>etc/authd.pass</authorization_pass_path>
    </enrollment>
  </client>

  <!-- Registros que vigila el agente (ajustar al sistema operativo) -->
  <localfile>
    <log_format>journald</log_format>
    <location>journald</location>
  </localfile>
</ossec_config>
